[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "discord-voice-notification-bot"
version = "1.0.0"
description = "Notify Telegram when a monitored Discord voice channel becomes occupied"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["discord.py==2.7.1", "aiohttp>=3.13.3,<4"]

[project.scripts]
voice-notify = "voice_notify.main:main"

[dependency-groups]
dev = ["hatchling>=1.27,<2", "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_notify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error", "ignore:davey is not installed:RuntimeWarning"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
